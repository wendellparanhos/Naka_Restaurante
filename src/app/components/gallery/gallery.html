<section id="gallery" class="gallery naka-section">
  <div class="gallery__header">
    <h2 class="naka-section-title gallery__title">A <span>Exposição</span></h2>
  </div>

  <div class="gallery__scroll-container" #scrollContainer>
    <div class="gallery__track">
      <!-- 
        Horizontal scroll layout: items snap to center. 
        Active item in center is colorful, others are grayscale/faded.
      -->
      <div class="gallery__item" 
           *ngFor="let img of images; let i = index" 
           [class.active]="activeIndex === i"
           (click)="openLightbox(i)">
        <div class="gallery__item-inner">
          <img [src]="img" [alt]="'Galeria Naka ' + (i+1)">
          <div class="gallery__caption">Naka / 0{{i + 1}}</div>
        </div>
      </div>
      <!-- Empty space at the end so the last item can snap to the center -->
      <div class="gallery__spacer"></div>
    </div>
  </div>

  <!-- Fullscreen Lightbox (remains unchanged) -->
  <div class="gallery__lightbox" [class.open]="isLightboxOpen" (click)="closeLightbox()">
    <button class="gallery__lightbox-close" (click)="closeLightbox()">FECHAR</button>
    <div class="gallery__lightbox-content" (click)="$event.stopPropagation()">
      <img [src]="currentImage" alt="Gallery Zoom">
      <div class="gallery__lightbox-nav">
        <button (click)="prevImage()">ANT.</button>
        <button (click)="nextImage()">PRÓX.</button>
      </div>
    </div>
  </div>
</section>
