<section id="gallery" class="gallery naka-section" #gallerySection>
  <div class="naka-container">
    <div class="gallery__header">
      <h2 class="naka-section-title">Nossa <span>Galeria</span></h2>
      <div class="naka-divider"></div>
      <p class="naka-section-subtitle">
        Uma amostra visual da nossa culinária excepcional e do nosso ambiente acolhedor.
      </p>
    </div>

    <div class="gallery__grid">
      <div class="gallery__item" *ngFor="let image of images; let i = index" [style.transition-delay]="(i * 0.1) + 's'" (click)="openLightbox(image)">
        <img [src]="image.src" [alt]="image.alt" loading="lazy" class="gallery__img">
        <div class="gallery__overlay">
          <span class="gallery__icon">+</span>
          <h3 class="gallery__title">{{ image.title }}</h3>
        </div>
      </div>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" [class.lightbox--active]="lightboxImage" (click)="closeLightbox()">
    <button class="lightbox__close" aria-label="Close lightbox">&times;</button>
    <div class="lightbox__content" (click)="$event.stopPropagation()">
      <img *ngIf="lightboxImage" [src]="lightboxImage.src" [alt]="lightboxImage.alt" class="lightbox__img">
      <h3 *ngIf="lightboxImage" class="lightbox__title">{{ lightboxImage.title }}</h3>
    </div>
  </div>
</section>
